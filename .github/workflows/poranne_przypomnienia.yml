name: Poranne Przypomnienia o Służbie

on:
  schedule:
    # Codziennie o 05:53 UTC (06:53 czasu zimowego CET / 07:53 letniego CEST)
    # Nie używamy pełnej godziny (:00), bo kolejki cron GitHub Actions o :00 mają wielogodzinne opóźnienia.
    - cron: '53 5 * * *'
  workflow_dispatch: # Możliwość uruchomienia testowego ręcznie z poziomu GitHuba

jobs:
  przypomnienia:
    name: Wyślij powiadomienia PUSH o dzisiejszej służbie
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wysłanie powiadomień
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/wyslij_poranne_przypomnienia.js
