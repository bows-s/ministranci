name: Automatyczna Kopia Zapasowa Bazy (Backup)

on:
  schedule:
    # W każdą niedzielę o 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Możliwość uruchomienia na żądanie z GitHuba

jobs:
  backup:
    name: Pobierz zrzut bazy i zapisz artefakt
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wykonanie kopii zapasowej
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/backup_firestore.js

      - name: Zapisanie pliku backupu jako artefakt GitHuba
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
